{{ define "main" }}
{{ partial "page-header.html" . }}
<article class="wrap page-body">
  {{ if eq .Section "news" }}
    <p class="label"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
  {{ end }}
  <div class="prose">{{ .Content }}</div>
  {{ if eq .Section "news" }}<p><a class="more" href="{{ "news/" | relURL }}">← All news</a></p>{{ end }}
</article>
{{ end }}
